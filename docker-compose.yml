# Local infra for AEIOS (optional — kernel runs without these).
# Requires Docker Desktop / Docker Engine.
#
# Object storage (MinIO/S3) is deferred: artifacts persist in SQLite/Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeios
      POSTGRES_PASSWORD: aeios
      POSTGRES_DB: aeios
    ports:
      - "5432:5432"
    volumes:
      - aeios_pg:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - aeios_qdrant:/qdrant/storage

volumes:
  aeios_pg:
  aeios_qdrant:
